[project]
name = "backend"
version = "0.1.0"
description = "API assíncrona da plataforma Constructo"
requires-python = ">=3.12.3,<3.13"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Equipe Constructo" },
]
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
