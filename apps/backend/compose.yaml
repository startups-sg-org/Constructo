services:
  backend:
    pull_policy: never
    container_name: backend
    hostname: backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: multistage.dockerfile
      target: development
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - constructo-network
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .env
            - .venv/
            - __pycache__/
            - constructo.db
        - action: rebuild
          path: ./uv.lock

  db:
    container_name: db
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    networks:
      - constructo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:

networks:
  constructo-network:
    driver: bridge
